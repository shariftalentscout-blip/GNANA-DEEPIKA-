<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gnana Deepika | Knowledge, Skills, Career & Growth</title>

<meta name="description" content="Gnana Deepika by Shaik Sharif — knowledge, practical skills, career roadmaps, real-life learning, projects, software ideas and career guidance.">

<meta name="author" content="Shaik Sharif">
<meta name="theme-color" content="#075e5a">

<link rel="icon" href="./gnana-deepika-logo.png">

<style>

:root{
    --dark:#033b39;
    --dark2:#075e5a;

    --green:#087f6e;
    --green2:#16a085;

    --teal:#008f95;
    --teal2:#20b8b0;

    --gold:#c9a43b;

    --white:#ffffff;
    --soft:#f1faf8;
    --cream:#f8fcfa;

    --text:#173b39;
    --muted:#627773;
    --border:#d7ebe6;

    --shadow:0 18px 55px rgba(0,105,95,.10);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    color:var(--text);
    background:#fff;
    line-height:1.7;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
}

nav{
    min-height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:54px;
    height:54px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 25px rgba(8,127,110,.22);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand-text strong{
    display:block;
    color:var(--dark);
    font-size:16px;
    letter-spacing:1.5px;
}

.brand-text small{
    color:var(--green);
    font-size:10px;
    letter-spacing:2px;
}

.nav-links{
    display:flex;
    gap:24px;
    font-size:14px;
    font-weight:700;
}

.nav-links a{
    transition:.25s;
}

.nav-links a:hover{
    color:var(--teal);
}

/* HERO */

.hero{
    min-height:calc(100vh - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(32,184,176,.28),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(22,160,133,.20),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #032f2d,
            #075e5a,
            #008f95
        );
}

.hero:before{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.13);
    animation:rotate 25s linear infinite;
}

.hero:after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(32,184,176,.14);
    filter:blur(75px);
    animation:glow 5s ease-in-out infinite;
}

@keyframes rotate{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

@keyframes glow{
    0%,100%{
        transform:scale(.8);
        opacity:.5;
    }
    50%{
        transform:scale(1.2);
        opacity:1;
    }
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:900px;
    animation:fadeUp 1.1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero-logo{
    width:105px;
    height:105px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 25px;
    border:2px solid rgba(255,255,255,.55);
    box-shadow:
        0 0 30px rgba(32,184,176,.35),
        0 0 70px rgba(8,127,110,.20);
}

.hero-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.eyebrow{
    color:#aaf2e9;
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:12px;
    font-weight:800;
}

.hero h1{
    font-size:clamp(45px,7vw,82px);
    line-height:1.03;
    margin:18px 0;
}

.hero h1 span{
    color:#b9fff5;
    text-shadow:0 0 25px rgba(32,184,176,.25);
}

.hero-description{
    max-width:800px;
    margin:auto;
    font-size:19px;
    color:#dff7f3;
}

.hero-motto{
    margin:28px auto;
    max-width:720px;
    padding:18px 25px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.07);
    border-radius:18px;
    font-size:18px;
    font-weight:800;
}

.motto{
    color:#b9fff5;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:28px;
}

.btn{
    display:inline-block;
    padding:14px 25px;
    border-radius:13px;
    font-weight:800;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
}

.btn-green{
    color:white;
    background:linear-gradient(135deg,var(--green),var(--green2));
    box-shadow:0 0 30px rgba(22,160,133,.25);
}

.btn-teal{
    color:white;
    background:linear-gradient(135deg,var(--teal),var(--teal2));
    box-shadow:0 0 30px rgba(32,184,176,.22);
}

.btn-outline{
    color:white;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.06);
}

/* SECTIONS */

section{
    padding:90px 0;
}

.soft{
    background:var(--soft);
}

.cream{
    background:linear-gradient(135deg,#f1faf8,#f8fcfa);
}

.section-title{
    max-width:800px;
    margin:0 auto 50px;
    text-align:center;
}

.section-title h2{
    color:var(--dark);
    font-size:clamp(32px,5vw,50px);
    line-height:1.15;
    margin:10px 0;
}

.section-title p{
    color:var(--muted);
}

/* CARDS */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card{
    position:relative;
    overflow:hidden;
    background:white;
    border:1px solid var(--border);
    border-radius:23px;
    padding:28px;
    box-shadow:var(--shadow);
    transition:.35s;
}

.card:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:3px;
    background:linear-gradient(
        90deg,
        var(--green),
        var(--teal),
        var(--green2)
    );
    transform:scaleX(0);
    transition:.4s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:
        0 28px 70px rgba(0,105,95,.14),
        0 0 30px rgba(32,184,176,.08);
}

.card:hover:before{
    transform:scaleX(1);
}

.icon{
    font-size:35px;
    margin-bottom:10px;
}

.card h3{
    color:var(--dark);
    margin-bottom:8px;
    font-size:20px;
}

.card p{
    color:var(--muted);
}

/* SKILLS */

.skills-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.skill-card{
    padding:23px;
    background:white;
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,105,95,.07);
    transition:.3s;
    display:flex;
    flex-direction:column;
    justify-content:between;
}

.skill-card:hover{
    transform:translateY(-7px);
    box-shadow:0 20px 45px rgba(0,105,95,.13);
}

.skill-card h3{
    color:var(--dark);
    font-size:17px;
    margin-bottom:6px;
}

.skill-card p{
    color:var(--muted);
    font-size:14px;
    margin-bottom:15px;
}

.skill-green{border-top:4px solid #087f6e}
.skill-teal{border-top:4px solid #008f95}
.skill-mint{border-top:4px solid #20b8b0}
.skill-dark{border-top:4px solid #075e5a}

/* UPLOAD BUTTON STYLING */
.upload-btn-container {
    margin-top: auto;
}

.upload-btn-container input[type="file"] {
    display: none;
}

.custom-upload-btn {
    display: block;
    text-align: center;
    background: linear-gradient(135deg, var(--teal), var(--teal2));
    color: white;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 4px 10px rgba(0,143,149,.15);
}

.custom-upload-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, var(--green), var(--green2));
}

/* STORY */

.story{
    max-width:900px;
    margin:auto;
    padding:38px;
    background:white;
    border-radius:25px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

.story p{
    color:var(--muted);
    margin-bottom:17px;
}

.story strong{
    color:var(--dark);
}

/* ROADMAP */

.roadmap{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.roadmap-card{
    padding:30px;
    border-radius:23px;
    background:white;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    transition:.35s;
}

.roadmap-card:hover{
    transform:translateY(-8px);
}

.roadmap-card h3{
    color:var(--dark);
    margin-bottom:12px;
}

.roadmap-card ul{
    padding-left:20px;
    color:var(--muted);
}

.roadmap-card li{
    margin-bottom:7px;
}

/* RESPONSIVE */

@media(max-width:1024px){
    .skills-grid{grid-template-columns:repeat(3,1fr)}
    .grid,.roadmap{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:768px){
    .skills-grid{grid-template-columns:repeat(2,1fr)}
    .grid,.roadmap{grid-template-columns:1fr}
    .nav-links{display:none}
    section{padding:60px 0}
}

@media(max-width:480px){
    .skills-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <div class="brand">
                <div class="logo">
                    <img src="./gnana-deepika-logo.png" alt="Gnana Deepika Logo">
                </div>
                <div class="brand-text">
                    <strong>GNANA DEEPIKA</strong>
                    <small>KNOWLEDGE • SKILLS • GROWTH</small>
                </div>
            </div>
            <div class="nav-links">
                <a href="#story">My Story</a>
                <a href="#knowledge">Knowledge</a>
                <a href="#roadmaps">Learning Roadmaps</a>
